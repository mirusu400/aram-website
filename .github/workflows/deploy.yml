name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by aram-emu right after it publishes a new `nightly` release,
  # so the site always serves the latest runtime within minutes.
  repository_dispatch:
    types: [nightly-updated]
  schedule:
    # Safety net in case a dispatch is missed.
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test player permalink contract
        run: node --test player/permalink.test.js

      - name: Fetch WebAssembly runtime from aram-emu nightly release
        run: bash scripts/sync-player.sh

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp robots.txt sitemap.xml _site/
          cp -r assets _site/
          cp -r player _site/
          echo aram.mir.sh > _site/CNAME
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
