<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<title>ARAM - Archived Runtime for ARM Mobiles</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    background: #101014; color: #e6e6ea;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; max-width: 100vw; max-height: 100vh; outline: none; }
  #boot {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #101014; transition: opacity .4s ease;
  }
  #boot.hidden { opacity: 0; pointer-events: none; }
  #boot h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .5px; }
  #boot p { margin: 0; color: #9a9aa6; }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid #2a2a33; border-top-color: #00d992; border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot .err { color: #ff6b6b; max-width: 42ch; text-align: center; }
  #chrow { display: flex; gap: 4px; padding: 4px; border: 1px solid #2a2a33; border-radius: 999px; margin-top: 4px; }
  #chrow a {
    font-size: 12px; font-weight: 600; color: #9a9aa6; text-decoration: none;
    padding: 6px 16px; border-radius: 999px; transition: .15s;
  }
  #chrow a:hover { color: #e6e6ea; }
  #chrow a.on { background: #00d992; color: #06140d; }
</style>
</head>
<body>
<div id="boot">
  <div class="spinner" id="spinner"></div>
  <h1>ARAM</h1>
  <p id="status">Loading runtime…</p>
  <div id="chrow">
    <a id="chStable" href="?ch=stable">Stable</a>
    <a id="chNightly" href="?ch=nightly">Nightly</a>
  </div>
</div>

<script src="permalink.js"></script>
<script>
(async function () {
  const boot = document.getElementById("boot");
  const status = document.getElementById("status");
  const spinner = document.getElementById("spinner");

  // resolve channel: ?ch= wins, else remembered choice, else stable
  const params = new URLSearchParams(location.search);
  let ch = params.get("ch");
  if (ch !== "stable" && ch !== "nightly") { try { ch = localStorage.getItem("aram-ch"); } catch (e) {} }
  if (ch !== "stable" && ch !== "nightly") ch = "stable";
  try { localStorage.setItem("aram-ch", ch); } catch (e) {}
  const active = document.getElementById(ch === "stable" ? "chStable" : "chNightly");
  if (active) active.classList.add("on");
  if (globalThis.ARAMPermalink) {
    document.getElementById("chStable").href = ARAMPermalink.withChannel(location.href, "stable");
    document.getElementById("chNightly").href = ARAMPermalink.withChannel(location.href, "nightly");
  }

  function fail(message) {
    spinner.style.display = "none";
    status.className = "err";
    status.textContent = message;
  }

  if (!globalThis.ARAMPermalink) {
    fail("Failed to load the permalink helper.");
    return;
  }

  let initialSpec;
  try {
    initialSpec = ARAMPermalink.parse(location.search, location.href);
  } catch (e) {
    fail(e && e.message ? e.message : String(e));
    return;
  }

  status.textContent = "Loading ARAM (" + ch + ")…";

  // load the channel's wasm_exec.js (must match the wasm's Go toolchain)
  await new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = ch + "/wasm_exec.js";
    s.onload = resolve;
    s.onerror = () => reject(new Error("wasm_exec.js"));
    document.head.appendChild(s);
  }).catch(() => {});

  if (typeof Go !== "function") {
    fail("Failed to load the " + ch + " runtime loader.");
    return;
  }

  if (!("instantiateStreaming" in WebAssembly)) {
    WebAssembly.instantiateStreaming = async (resp, importObject) => {
      const source = await (await resp).arrayBuffer();
      return await WebAssembly.instantiate(source, importObject);
    };
  }

  const go = new Go();
  try {
    status.textContent = initialSpec
      ? "Downloading " + initialSpec.name + " and the " + ch + " build…"
      : "Downloading " + ch + " build…";
    const wasmPromise = WebAssembly.instantiateStreaming(
      fetch(ch + "/aram.wasm"),
      go.importObject,
    );
    const packagePromise = initialSpec
      ? ARAMPermalink.fetchPackage(initialSpec)
      : Promise.resolve(null);
    const [result, initialPackage] = await Promise.all([wasmPromise, packagePromise]);
    if (initialPackage) {
      // The ARAM frontend consumes and deletes this value synchronously when
      // the Go/WASM runtime starts, then opens it through OpenRequest.Data.
      globalThis.__aramInitialPackage = initialPackage;
      status.textContent = "Starting " + initialPackage.name + "…";
    }
    requestAnimationFrame(() => requestAnimationFrame(() => boot.classList.add("hidden")));
    await go.run(result.instance);
  } catch (e) {
    fail("Failed to start: " + (e && e.message ? e.message : e));
    console.error(e);
  }
})();
</script>
</body>
</html>
